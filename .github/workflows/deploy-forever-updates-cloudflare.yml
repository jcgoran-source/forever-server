name: Deploy Forever Updates to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/forever-updates/.deploy-cloudflare'

permissions:
  contents: read

concurrency:
  group: deploy-forever-updates-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Forever updates and briefing
        run: node --test services/forever-updates/*.test.mjs services/forever-briefing/*.test.mjs
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config services/forever-updates/wrangler.jsonc
      - name: Sync updates Discord webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          printf '%s' "$DISCORD_WEBHOOK_URL" |
            npx --yes wrangler@latest secret put DISCORD_FOREVER_UPDATES_WEBHOOK_URL \
              --config services/forever-updates/wrangler.jsonc

      - name: Sync optional briefing Discord webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_FOREVER_BRIEFING_WEBHOOK_URL: ${{ secrets.DISCORD_FOREVER_BRIEFING_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_FOREVER_BRIEFING_WEBHOOK_URL" ]; then
            echo "DISCORD_FOREVER_BRIEFING_WEBHOOK_URL is not configured; briefing delivery remains paused."
            exit 0
          fi
          printf '%s' "$DISCORD_FOREVER_BRIEFING_WEBHOOK_URL" |
            npx --yes wrangler@latest secret put DISCORD_FOREVER_BRIEFING_WEBHOOK_URL \
              --config services/forever-updates/wrangler.jsonc
