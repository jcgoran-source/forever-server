name: Deploy Forever Updates to Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'services/forever-updates/.deploy-cloudflare'

permissions:
  contents: read

concurrency:
  group: deploy-forever-updates-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Forever update collector
        run: node --test services/forever-updates/*.test.mjs
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config services/forever-updates/wrangler.jsonc
      - name: Sync Discord webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          printf '%s' "$DISCORD_WEBHOOK_URL" |
            npx --yes wrangler@latest secret put DISCORD_FOREVER_UPDATES_WEBHOOK_URL \
              --config services/forever-updates/wrangler.jsonc
