name: Verify Forever Historical Backfill

on:
  push:
    branches: [main]
    paths:
      - 'services/.verify-forever-backfill'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe historical briefing backfill
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 90s npx --yes wrangler@latest tail forever-updates \
            --format json \
            --config services/forever-updates/wrangler.jsonc > /tmp/backfill-tail.log 2>&1
          set -e
          cat /tmp/backfill-tail.log
          if ! grep -Eq 'historical_backfill|prelaunch-2026-10-20-v1 already completed' /tmp/backfill-tail.log; then
            echo "No completed historical backfill evidence observed."
            exit 1
          fi
          if grep -Eq '"outcome": "exception"|"outcome":"exception"' /tmp/backfill-tail.log; then
            echo "Observed a failed Worker invocation during verification."
            exit 1
          fi
          echo "Observed completed Forever historical briefing backfill."
