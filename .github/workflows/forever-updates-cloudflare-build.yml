name: Forever Updates Cloudflare Build Check

on:
  push:
    branches: [main]
    paths:
      - 'services/forever-updates/**'
      - '.github/workflows/forever-updates-cloudflare-build.yml'
  pull_request:
    paths:
      - 'services/forever-updates/**'
      - '.github/workflows/forever-updates-cloudflare-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Forever update collector
        run: node --test services/forever-updates/*.test.mjs
      - name: Bundle Cloudflare Worker
        run: |
          npx --yes wrangler@latest deploy --dry-run \
            --config services/forever-updates/wrangler.jsonc \
            --outdir /tmp/forever-updates
