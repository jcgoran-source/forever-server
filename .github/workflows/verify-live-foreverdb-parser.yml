name: Verify Live ForeverDB Parser

on:
  push:
    branches: [main]
    paths:
      - 'services/realm-status/.verify-live-parser'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe live-profile Cloudflare invocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@latest tail forever-realm-status \
            --format json \
            --status ok \
            --config services/realm-status/wrangler.jsonc > /tmp/realm-tail.log 2>&1
          set -e
          cat /tmp/realm-tail.log
          if ! grep -q '"profile": "live"' /tmp/realm-tail.log; then
            echo "Did not observe live profile."
            exit 1
          fi
          if ! grep -q '"phase": "prelaunch"' /tmp/realm-tail.log; then
            echo "Did not observe prelaunch ForeverDB phase."
            exit 1
          fi
          if ! grep -q '"login_fresh": true' /tmp/realm-tail.log; then
            echo "ForeverDB live login result was not fresh."
            exit 1
          fi
          if ! grep -q '"status": "prelaunch"' /tmp/realm-tail.log; then
            echo "Resolver did not report prelaunch."
            exit 1
          fi
          echo "Observed repaired ForeverDB live/prelaunch sensor."
