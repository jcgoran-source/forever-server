name: Verify Realm Sentry Cloudflare Cron

on:
  push:
    branches: [main]
    paths:
      - 'services/realm-status/.verify-cloudflare'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe a scheduled Worker invocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@latest tail forever-realm-status \
            --format json \
            --status ok \
            --config services/realm-status/wrangler.jsonc > /tmp/realm-tail.log 2>&1
          set -e
          cat /tmp/realm-tail.log
          if ! grep -Eq '"outcome":"ok"|"outcome": "ok"|No realm-status transition|Bootstrapped beta realm sentry' /tmp/realm-tail.log; then
            echo "No successful Cloudflare invocation observed during verification window."
            exit 1
          fi
          echo "Observed a successful Cloudflare realm-sentry invocation."
