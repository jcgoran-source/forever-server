name: Forever Realm Status (GitHub fallback)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: forever-realm-status-github
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test realm-status resolver
        run: node --test services/realm-status/core.test.mjs
      - name: Probe Forever realm services
        env:
          FOREVER_ENV: beta
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ISSUE_NUMBER: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REALM_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_REALM_STATUS_WEBHOOK_URL }}
        run: node services/realm-status/runtimes/github.mjs
