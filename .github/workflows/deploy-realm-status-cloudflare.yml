name: Deploy Realm Sentry to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-forever-realm-status-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test realm-status resolver
        run: node --test services/realm-status/*.test.mjs
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config services/realm-status/wrangler.jsonc
      - name: Sync Discord webhook secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_REALM_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_REALM_STATUS_WEBHOOK_URL }}
        run: |
          printf '%s' "$DISCORD_REALM_STATUS_WEBHOOK_URL" |
            npx --yes wrangler@latest secret put DISCORD_REALM_STATUS_WEBHOOK_URL \
              --config services/realm-status/wrangler.jsonc
