name: Verify Generalized Forever Briefing

on:
  push:
    branches: [main]
    paths:
      - 'services/.verify-generalized-briefing'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe scheduled generalized briefing runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@latest tail forever-updates \
            --format json \
            --config services/forever-updates/wrangler.jsonc > /tmp/generalized-tail.log 2>&1
          set -e
          cat /tmp/generalized-tail.log
          if ! grep -Eq 'No new Blizzard posts|Processed [0-9]+ new Blizzard post|Synthesized Blizzard post' /tmp/generalized-tail.log; then
            echo "No successful scheduled Forever update poll observed."
            exit 1
          fi
          if grep -Eq '"outcome": "exception"|"outcome":"exception"' /tmp/generalized-tail.log; then
            echo "Observed a failed Worker invocation."
            exit 1
          fi
          echo "Observed healthy generalized briefing runtime."
