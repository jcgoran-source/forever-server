name: Test Forever Tools Role Notifications

on:
  push:
    branches: [main]
    paths:
      - 'services/.test-tools-role-notifications'

permissions:
  contents: read

jobs:
  test-notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send synthetic role-mention tests
        env:
          ROLE_ID: '1564160683808129035'
          REALM_WEBHOOK: ${{ secrets.DISCORD_REALM_STATUS_WEBHOOK_URL }}
          UPDATES_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BRIEFING_WEBHOOK: ${{ secrets.DISCORD_FOREVER_BRIEFING_WEBHOOK_URL }}
        run: |
          node <<'NODE'
          const role = process.env.ROLE_ID;
          const tests = [
            ['Forever Realm Sentry', process.env.REALM_WEBHOOK, 'Realm sentry notification test'],
            ['Forever Updates', process.env.UPDATES_WEBHOOK, 'Forever updates notification test'],
            ['Forever Briefing', process.env.BRIEFING_WEBHOOK, 'Forever briefing notification test'],
          ];

          for (const [username, webhook, title] of tests) {
            if (!webhook) throw new Error(`Missing webhook for ${username}`);
            const separator = webhook.includes('?') ? '&' : '?';
            const response = await fetch(`${webhook}${separator}wait=true`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                username,
                content: `<@&${role}>`,
                allowed_mentions: { parse: [], roles: [role] },
                embeds: [{
                  title,
                  description: 'Synthetic test only — the shared Forever Tools role mention is active.',
                  timestamp: new Date().toISOString(),
                }],
              }),
            });
            if (!response.ok) {
              throw new Error(`${username} test -> HTTP ${response.status}`);
            }
            console.log(`Sent ${username} role-mention test.`);
            await new Promise((resolve) => setTimeout(resolve, 750));
          }
          NODE
