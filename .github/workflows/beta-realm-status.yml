name: Forever Beta Realm Status

on:
  push:
    branches: [main]
    paths:
      - 'services/beta-realm-status/**'
      - '.github/workflows/beta-realm-status.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: forever-beta-realm-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Forever Beta services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_ISSUE_NUMBER: '1'
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_REALM_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_REALM_STATUS_WEBHOOK_URL }}
        run: node services/beta-realm-status/check.mjs
