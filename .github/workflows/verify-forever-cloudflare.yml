name: Verify Forever Cloudflare Services

on:
  push:
    branches: [main]
    paths:
      - 'services/.verify-forever-cloudflare'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Forever update collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@latest tail forever-updates \
            --format json \
            --status ok \
            --config services/forever-updates/wrangler.jsonc > /tmp/updates-tail.log 2>&1
          set -e
          cat /tmp/updates-tail.log
          if ! grep -Eq 'Bootstrapped Forever update collector|No new Blizzard posts|Processed [0-9]+ new Blizzard post' /tmp/updates-tail.log; then
            echo "No successful Forever update collector poll observed."
            exit 1
          fi
          echo "Observed successful Forever update collector poll."
