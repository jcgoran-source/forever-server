name: Verify Forever Cloudflare Services

on:
  push:
    branches: [main]
    paths:
      - 'services/.verify-forever-cloudflare'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify 30-second realm alarm loop
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 78s npx --yes wrangler@latest tail forever-realm-status \
            --format json \
            --status ok \
            --config services/realm-status/wrangler.jsonc > /tmp/realm-tail.log 2>&1
          set -e
          cat /tmp/realm-tail.log
          COUNT=$(grep -c 'Realm sentry next 30-second alarm scheduled' /tmp/realm-tail.log || true)
          echo "Observed realm alarm completions: $COUNT"
          if [ "$COUNT" -lt 2 ]; then
            echo "Did not observe two 30-second realm alarm cycles."
            exit 1
          fi

      - name: Verify Forever update collector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          timeout 85s npx --yes wrangler@latest tail forever-updates \
            --format json \
            --status ok \
            --config services/forever-updates/wrangler.jsonc > /tmp/updates-tail.log 2>&1
          set -e
          cat /tmp/updates-tail.log
          if ! grep -Eq 'Bootstrapped Forever update collector|No new Blizzard posts|Processed [0-9]+ new Blizzard post' /tmp/updates-tail.log; then
            echo "No successful Forever update collector poll observed."
            exit 1
          fi
          echo "Observed successful Forever update collector poll."
