name: Forever Beta Blue Checker

on:
  push:
    branches: [main]
    paths:
      - 'services/beta-blue-checker/**'
      - '.github/workflows/beta-blue-checker.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forever-beta-blue-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for new Forever blueposts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node services/beta-blue-checker/check.mjs
